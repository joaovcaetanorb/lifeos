<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Álbuns · Música · lifeOS</title>
<link rel="stylesheet" href="/static/tokens.css" />
<link rel="stylesheet" href="/static/effects.css" />
<style>
.album-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:1rem; margin-top:1rem; align-items:stretch; }
.album-card{ background:var(--panel-raised); border:1px solid var(--hair); border-radius:var(--radius); overflow:hidden; transition:border-color .18s ease; display:flex; flex-direction:column; height:100%; }
.album-card:hover{ border-color:var(--hair-bright); }
.album-cover-wrap{ position:relative; flex:none; }
.album-cover-wrap .card-cover{ display:block; }
.album-fav{ position:absolute; top:.4rem; right:.4rem; width:26px; height:26px; display:flex; align-items:center; justify-content:center;
  background:rgba(11,13,9,.7); border:1px solid var(--hair-bright); border-radius:2px; cursor:pointer; font-size:1rem; line-height:1; color:var(--ink-dim); backdrop-filter:blur(2px); }
.album-fav.on{ color:var(--accent-bright); border-color:var(--accent); }
.album-body{ padding:.7rem .8rem .9rem; display:flex; flex-direction:column; flex:1; }
.album-nome{ font-weight:700; font-size:.9rem; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.34em; }
.album-artista{ color:var(--ink-muted); font-size:.8rem; margin-top:.1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.album-meta{ color:var(--ink-dim); font-size:.72rem; margin-top:.3rem; }
.album-nota{ color:var(--accent-bright); font-size:.74rem; font-weight:600; margin-top:.35rem; }
.album-actions{ display:flex; gap:.4rem; margin-top:auto; padding-top:.8rem; }
.album-actions button{ flex:1; background:none; border:1px solid var(--hair); color:var(--ink-dim); font-size:.68rem; padding:.3rem; border-radius:2px; cursor:pointer; }
.album-actions button:hover{ border-color:var(--accent); color:var(--accent-bright); }
.filtros{ display:flex; gap:1rem; align-items:center; flex-wrap:wrap; margin-bottom:.5rem; }
.filtros input[type="text"]{ flex:1; min-width:200px; }
.filtros label{ display:flex; align-items:center; gap:.4rem; font-size:.82rem; color:var(--ink-muted); white-space:nowrap; }

.modal-overlay{ position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center; padding:1.2rem;
  background:rgba(5,6,4,.6); backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity .2s ease; }
.modal-overlay.open{ opacity:1; pointer-events:auto; }
.modal-box{ background:var(--panel); border:1px solid var(--hair-bright); border-radius:var(--radius); padding:1.3rem 1.4rem 1.5rem;
  width:min(440px, 100%); box-shadow:0 24px 60px -20px rgba(0,0,0,.8); transform:scale(.96) translateY(10px); transition:transform .2s cubic-bezier(.16,.8,.3,1); }
.modal-overlay.open .modal-box{ transform:scale(1) translateY(0); }
.modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; }
.modal-head h3{ margin:0; font-size:1rem; font-weight:700; }
.modal-close{ background:none; border:1px solid var(--hair); color:var(--ink-muted); width:26px; height:26px; border-radius:2px; cursor:pointer; line-height:1; }
.modal-close:hover{ border-color:var(--accent); color:var(--accent-bright); }
@media (prefers-reduced-motion: no-preference){ .modal-box{ transition:transform .2s cubic-bezier(.16,.8,.3,1), opacity .2s ease; } }

.modal-box.wide{ width:min(560px, 100%); }
.revisoes{ display:flex; flex-direction:column; gap:.8rem; max-height:min(70vh, 620px); overflow-y:auto; padding-right:.2rem; }
.revisao-item{ background:var(--panel-raised); border:1px solid var(--hair); border-radius:2px; padding:1rem 1.1rem; display:flex; flex-direction:column; gap:.5rem; }
.revisao-item .cs-data{ font-family:var(--font-label); font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted); }
.revisao-item .cs-nota{ color:var(--accent-bright); font-weight:700; font-size:1.15rem; }
.revisao-item .cs-faixa{ font-size:.8rem; color:var(--ink-muted); }
.revisao-item .cs-review{ font-size:.88rem; color:var(--ink); line-height:1.5; white-space:pre-wrap; }
.revisao-item .cs-actions{ display:flex; gap:.5rem; margin-top:.2rem; }
.revisao-item .cs-actions button{ background:none; border:1px solid var(--hair); color:var(--ink-dim); font-size:.7rem; padding:.3rem .7rem; border-radius:2px; cursor:pointer; }
.revisao-item .cs-actions button:hover{ border-color:var(--accent); color:var(--accent-bright); }
.revisao-add{ border:1px dashed var(--hair-bright); border-radius:2px; display:flex; align-items:center; justify-content:center; gap:.5rem; cursor:pointer; color:var(--ink-muted); font-size:.86rem; padding:1rem; }
.revisao-add:hover{ border-color:var(--accent); color:var(--accent-bright); }
</style>
</head>
<body>

<div class="scanlines"></div><div class="vignette"></div><div class="grain"></div><div class="glow-blob" id="glowBlob"></div>

<div class="wrap">
  <div class="topbar">
    <div class="id"><span class="led-dot"></span> LIFEOS · MÓDULO MÚSICA</div>
    <div class="id"><span class="clock" id="clock">--:--:--</span></div>
  </div>

  <div class="hero boot-flicker">
    <div class="eyebrow">álbuns — dados reais</div>
    <h1 class="title">$ albuns<span class="cursor"></span></h1>
    <p>Catálogo dos álbuns cadastrados — favoritar, editar e excluir gravam direto no banco.</p>
  </div>

  <nav class="modnav">
    <a href="/musica/estatisticas.html">estatísticas</a>
    <a href="/musica/diario.html">diário</a>
    <a href="/musica/albuns.html" class="active">álbuns</a>
    <a href="/musica/colagem.html">colagem</a>
    <a href="/musica/spotify.html">spotify</a>
  </nav>

  <section class="module" data-reveal>
    <div class="filtros">
      <input type="text" id="busca" placeholder="buscar por álbum ou artista..." />
      <label><input type="checkbox" id="soFavoritos" /> só favoritos</label>
    </div>
    <div id="grid" class="album-grid"><p class="empty-state">Carregando…</p></div>
  </section>

  <footer><span>backend FastAPI próprio · escreve no banco de verdade</span><span id="genTime"></span></footer>
</div>

<div class="modal-overlay" id="modalEditar">
  <div class="modal-box">
    <div class="modal-head"><h3>editar álbum</h3><button type="button" class="modal-close" id="modalFechar">×</button></div>
    <div class="field"><label>Nome</label><input type="text" id="edNome" /></div>
    <div class="field-row" style="margin-top:.6rem;">
      <div class="field"><label>Ano</label><input type="number" id="edAno" /></div>
      <div class="field"><label>Gênero</label><input type="text" id="edGenero" /></div>
    </div>

    <div class="field" style="margin-top:.8rem;">
      <label>Capa</label>
      <div style="display:flex;gap:.8rem;align-items:flex-start;">
        <img id="edCapaPreview" class="card-cover" style="width:72px;height:72px;flex:none;" />
        <div style="flex:1;display:flex;flex-direction:column;gap:.5rem;min-width:0;">
          <button type="button" class="btn" id="btnRecuperarSpotify" style="display:none;">recuperar capa original do Spotify</button>
          <div style="display:flex;gap:.4rem;">
            <input type="text" id="edBuscaCapa" placeholder="ou buscar outra capa no Spotify..." style="flex:1;" />
            <button type="button" class="btn" id="btnBuscarCapa">buscar</button>
          </div>
        </div>
      </div>
      <div id="edCapaResultados" style="display:none;margin-top:.6rem;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:.4rem;"></div>
    </div>
    <div class="field" style="margin-top:.6rem;"><label style="font-size:.62rem;">ou envie um arquivo manualmente</label><input type="file" id="edCapa" accept="image/*" /></div>

    <div class="btn-row">
      <button type="button" class="btn btn-primary" id="btnSalvarEdicao">salvar</button>
      <button type="button" class="btn" id="btnCancelarEdicao">cancelar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalEscutas">
  <div class="modal-box wide">
    <div class="modal-head"><h3 id="escutasTitulo">escutas</h3><button type="button" class="modal-close" id="modalEscutasFechar">×</button></div>
    <div class="revisoes" id="carrosselEscutas"></div>
  </div>
</div>

<div class="modal-overlay" id="modalNovaEscuta">
  <div class="modal-box">
    <div class="modal-head"><h3>nova escuta</h3><button type="button" class="modal-close" id="modalNovaEscutaFechar">×</button></div>
    <div class="field-row">
      <div class="field"><label>Data</label><input type="date" id="neData" /></div>
      <div class="field"><label>Nota</label>
        <select id="neNota">
          <option value="">sem nota</option>
          <option>0.5</option><option>1</option><option>1.5</option><option>2</option><option>2.5</option>
          <option selected>3</option><option>3.5</option><option>4</option><option>4.5</option><option>5</option>
        </select>
      </div>
    </div>
    <div class="field" style="margin-top:.6rem;"><label>Faixa favorita</label><input type="text" id="neFaixa" /></div>
    <div class="field" style="margin-top:.6rem;"><label>Review</label><textarea id="neReview"></textarea></div>
    <div class="btn-row">
      <button type="button" class="btn btn-primary" id="btnSalvarNovaEscuta">registrar</button>
      <button type="button" class="btn" id="btnCancelarNovaEscuta">cancelar</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
<script>
(function(){
"use strict";
const L = LifeOS;
let timer = null;

function cardHtml(a) {
  return `
  <div class="album-card" data-id="${a.id}">
    <div class="album-cover-wrap">
      ${a.capa_url ? `<img class="card-cover" src="${a.capa_url}" alt="" />` : `<div class="card-cover placeholder">♪</div>`}
      <button class="album-fav ${a.favorito ? 'on' : ''}" data-action="fav">${a.favorito ? '★' : '☆'}</button>
    </div>
    <div class="album-body">
      <div class="album-nome">${a.nome}</div>
      <div class="album-artista">${a.artista_nome}</div>
      <div class="album-meta">${a.ano_lancamento || '—'}${a.genero ? ' · ' + a.genero : ''}</div>
      <div class="album-nota">${a.total_escutas ? `${a.nota_media != null ? '★ ' + a.nota_media.toFixed(1) : 'sem nota'} · ${a.total_escutas} escuta${a.total_escutas > 1 ? 's' : ''}` : 'nenhuma escuta ainda'}</div>
      <div class="album-actions">
        <button data-action="escutas">escutas</button>
        <button data-action="editar">editar</button>
        <button data-action="excluir">excluir</button>
      </div>
    </div>
  </div>`;
}

let albunsCache = {};
let modalAlbumId = null;
let modalSpotifyId = null;

function placeholderCapa() {
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72"><rect width="72" height="72" fill="#191C13"/></svg>`);
}

function abrirModal(a) {
  modalAlbumId = a.id;
  modalSpotifyId = a.spotify_id || null;
  document.getElementById('edNome').value = a.nome;
  document.getElementById('edAno').value = a.ano_lancamento || '';
  document.getElementById('edGenero').value = a.genero || '';
  document.getElementById('edCapa').value = '';
  document.getElementById('edBuscaCapa').value = '';
  document.getElementById('edCapaResultados').style.display = 'none';
  document.getElementById('edCapaResultados').innerHTML = '';
  document.getElementById('edCapaPreview').src = a.capa_url || placeholderCapa();
  document.getElementById('btnRecuperarSpotify').style.display = modalSpotifyId ? 'block' : 'none';
  document.getElementById('modalEditar').classList.add('open');
  document.getElementById('edNome').focus();
}
function fecharModal() {
  document.getElementById('modalEditar').classList.remove('open');
  modalAlbumId = null;
  modalSpotifyId = null;
}
document.getElementById('modalFechar').addEventListener('click', fecharModal);
document.getElementById('btnCancelarEdicao').addEventListener('click', fecharModal);
document.getElementById('modalEditar').addEventListener('click', e => { if (e.target.id === 'modalEditar') fecharModal(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  fecharModal();
  fecharModalEscutas();
  fecharModalNovaEscuta();
});

async function aplicarCapaSpotify(capaUrl) {
  if (!modalAlbumId || !capaUrl) return;
  try {
    const atualizado = await L.api(`/api/musica/albuns/${modalAlbumId}/capa-from-spotify`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ capa_url: capaUrl }),
    });
    document.getElementById('edCapaPreview').src = atualizado.capa_url;
    document.getElementById('edCapaResultados').style.display = 'none';
    L.toast('Capa atualizada.');
    carregar();
  } catch (e) {
    L.toast(e.message, true);
  }
}

document.getElementById('btnRecuperarSpotify').addEventListener('click', async () => {
  if (!modalSpotifyId) return;
  const btn = document.getElementById('btnRecuperarSpotify');
  btn.disabled = true; btn.textContent = 'buscando...';
  try {
    const { capa_url } = await L.api(`/api/musica/spotify/albuns/${modalSpotifyId}/capa`);
    if (!capa_url) throw new Error('Spotify não retornou uma capa pra esse álbum.');
    await aplicarCapaSpotify(capa_url);
  } catch (e) {
    L.toast(e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = 'recuperar capa original do Spotify';
  }
});

async function buscarCapaSpotify() {
  const q = document.getElementById('edBuscaCapa').value.trim();
  if (!q) return;
  const grid = document.getElementById('edCapaResultados');
  grid.style.display = 'grid';
  grid.innerHTML = '<p class="empty-state">buscando...</p>';
  try {
    const resultados = await L.api(`/api/musica/spotify/search-albums?q=${encodeURIComponent(q)}`);
    if (!resultados.length) { grid.innerHTML = '<p class="empty-state">Nada encontrado.</p>'; return; }
    grid.innerHTML = resultados.map((r, i) => `
      <img data-i="${i}" src="${r.capa_url}" title="${r.nome} — ${r.artista}" style="width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--hair);cursor:pointer;" />
    `).join('');
    grid.querySelectorAll('img').forEach(img => {
      img.addEventListener('click', () => aplicarCapaSpotify(resultados[+img.dataset.i].capa_url));
    });
  } catch (e) {
    grid.innerHTML = `<p class="empty-state">${e.message}</p>`;
  }
}
document.getElementById('btnBuscarCapa').addEventListener('click', buscarCapaSpotify);
document.getElementById('edBuscaCapa').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); buscarCapaSpotify(); } });
document.getElementById('btnSalvarEdicao').addEventListener('click', async () => {
  if (!modalAlbumId) return;
  const fd = new FormData();
  fd.append('nome', document.getElementById('edNome').value);
  const ano = document.getElementById('edAno').value;
  if (ano) fd.append('ano_lancamento', ano);
  fd.append('genero', document.getElementById('edGenero').value);
  const capa = document.getElementById('edCapa').files[0];
  if (capa) fd.append('capa', capa);
  try {
    await L.api(`/api/musica/albuns/${modalAlbumId}`, { method: 'PATCH', body: fd });
    L.toast('Álbum atualizado.');
    fecharModal();
    carregar();
  } catch (e) {
    L.toast(e.message, true);
  }
});

async function carregar() {
  const grid = document.getElementById('grid');
  const q = document.getElementById('busca').value;
  const fav = document.getElementById('soFavoritos').checked;
  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (fav) params.set('favoritos', 'true');
  const albuns = await L.api(`/api/musica/albuns?${params.toString()}`);
  if (!albuns.length) { grid.innerHTML = '<p class="empty-state">Nenhum álbum encontrado.</p>'; return; }
  albunsCache = {}; albuns.forEach(a => { albunsCache[a.id] = a; });
  grid.innerHTML = albuns.map(cardHtml).join('');

  grid.querySelectorAll('.album-card').forEach(card => {
    const id = card.dataset.id;

    card.querySelector('[data-action="fav"]').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const on = btn.classList.contains('on');
      // otimista: muda na hora, desfaz só se o servidor recusar — sem isso
      // a estrela ficava "travada" até o round-trip do Turso responder.
      btn.classList.toggle('on');
      btn.textContent = on ? '☆' : '★';
      try {
        await L.api(`/api/musica/albuns/${id}/favorito`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ favorito: !on }),
        });
        if (albunsCache[id]) albunsCache[id].favorito = !on;
      } catch (err) {
        btn.classList.toggle('on');
        btn.textContent = on ? '★' : '☆';
        L.toast('Não consegui favoritar agora.', true);
      }
    });

    card.querySelector('[data-action="editar"]').addEventListener('click', () => abrirModal(albunsCache[id]));
    card.querySelector('[data-action="escutas"]').addEventListener('click', () => abrirModalEscutas(albunsCache[id]));

    card.querySelector('[data-action="excluir"]').addEventListener('click', async () => {
      if (!confirm('Excluir esse álbum e todas as escutas dele?')) return;
      await L.api(`/api/musica/albuns/${id}`, { method: 'DELETE' });
      L.toast('Álbum excluído.');
      carregar();
    });
  });
}

document.getElementById('busca').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(carregar, 300); });
document.getElementById('soFavoritos').addEventListener('change', carregar);

/* ---------------------------------------------------------------------
   modal de escutas (carrossel) + modal de nova escuta
--------------------------------------------------------------------- */
let escutasAlbumId = null;
let escutasAlbumNome = '';

function notaTexto(n) { return (n === null || n === undefined) ? 'sem nota' : `★ ${n}`; }
function dataBr(iso) { if (!iso) return ''; const [a, m, d] = iso.split('-'); return `${d}/${m}/${a}`; }

function slideHtml(e) {
  return `
  <div class="revisao-item" data-id="${e.id}">
    <div class="cs-view">
      <div class="cs-data">${dataBr(e.data)}</div>
      <div class="cs-nota">${notaTexto(e.nota)}</div>
      ${e.faixa_favorita ? `<div class="cs-faixa">faixa favorita: ${e.faixa_favorita}</div>` : ''}
      <div class="cs-review">${e.review ? e.review.replace(/</g, '&lt;') : '<span style="color:var(--ink-dim);">sem review</span>'}</div>
      <div class="cs-actions">
        <button data-action="editar-escuta">editar</button>
        <button data-action="excluir-escuta">excluir</button>
      </div>
    </div>
    <div class="cs-edit" style="display:none;">
      <div class="field"><label>Data</label><input type="date" class="cse-data" value="${e.data}" /></div>
      <div class="field" style="margin-top:.4rem;"><label>Nota</label>
        <select class="cse-nota">
          <option value="" ${e.nota == null ? 'selected' : ''}>sem nota</option>
          ${[0.5,1,1.5,2,2.5,3,3.5,4,4.5,5].map(n => `<option value="${n}" ${e.nota === n ? 'selected' : ''}>${n}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="margin-top:.4rem;"><label>Faixa favorita</label><input type="text" class="cse-faixa" value="${(e.faixa_favorita || '').replace(/"/g, '&quot;')}" /></div>
      <div class="field" style="margin-top:.4rem;"><label>Review</label><textarea class="cse-review" style="min-height:4em;">${e.review || ''}</textarea></div>
      <div class="cs-actions"><button data-action="salvar-escuta">salvar</button><button data-action="cancelar-escuta">cancelar</button></div>
    </div>
  </div>`;
}

async function carregarCarrossel() {
  const wrap = document.getElementById('carrosselEscutas');
  const escutas = await L.api(`/api/musica/albuns/${escutasAlbumId}/escutas`);
  const vazio = !escutas.length ? '<p class="empty-state">Ainda sem escutas registradas.</p>' : '';
  wrap.innerHTML = vazio + escutas.map(slideHtml).join('') + `<div class="revisao-add" id="addEscutaSlide">+ ${escutas.length ? 'registrar outra escuta' : 'registrar escuta'}</div>`;

  wrap.querySelectorAll('.revisao-item').forEach(slide => {
    const eid = slide.dataset.id;
    const view = slide.querySelector('.cs-view'), edit = slide.querySelector('.cs-edit');
    slide.querySelector('[data-action="editar-escuta"]').addEventListener('click', () => { view.style.display = 'none'; edit.style.display = 'flex'; edit.style.flexDirection = 'column'; edit.style.gap='0'; });
    slide.querySelector('[data-action="cancelar-escuta"]').addEventListener('click', () => { view.style.display = 'flex'; view.style.flexDirection='column'; view.style.gap='.5rem'; edit.style.display = 'none'; });
    slide.querySelector('[data-action="excluir-escuta"]').addEventListener('click', async () => {
      if (!confirm('Excluir essa escuta?')) return;
      await L.api(`/api/musica/escutas/${eid}`, { method: 'DELETE' });
      L.toast('Escuta excluída.');
      carregarCarrossel();
      carregar();
    });
    slide.querySelector('[data-action="salvar-escuta"]').addEventListener('click', async () => {
      const notaVal = slide.querySelector('.cse-nota').value;
      await L.api(`/api/musica/escutas/${eid}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          data: slide.querySelector('.cse-data').value,
          nota: notaVal === '' ? null : parseFloat(notaVal),
          faixa_favorita: slide.querySelector('.cse-faixa').value,
          review: slide.querySelector('.cse-review').value,
        }),
      });
      L.toast('Escuta atualizada.');
      carregarCarrossel();
      carregar();
    });
  });

  document.getElementById('addEscutaSlide').addEventListener('click', abrirModalNovaEscuta);
}

function abrirModalEscutas(a) {
  escutasAlbumId = a.id;
  escutasAlbumNome = `${a.nome} — ${a.artista_nome}`;
  document.getElementById('escutasTitulo').textContent = `escutas — ${escutasAlbumNome}`;
  document.getElementById('modalEscutas').classList.add('open');
  carregarCarrossel();
}
function fecharModalEscutas() { document.getElementById('modalEscutas').classList.remove('open'); }
document.getElementById('modalEscutasFechar').addEventListener('click', fecharModalEscutas);
document.getElementById('modalEscutas').addEventListener('click', e => { if (e.target.id === 'modalEscutas') fecharModalEscutas(); });

function abrirModalNovaEscuta() {
  document.getElementById('neData').value = L.isoLocal();
  document.getElementById('neNota').value = '3';
  document.getElementById('neFaixa').value = '';
  document.getElementById('neReview').value = '';
  document.getElementById('modalNovaEscuta').classList.add('open');
}
function fecharModalNovaEscuta() { document.getElementById('modalNovaEscuta').classList.remove('open'); }
document.getElementById('modalNovaEscutaFechar').addEventListener('click', fecharModalNovaEscuta);
document.getElementById('btnCancelarNovaEscuta').addEventListener('click', fecharModalNovaEscuta);
document.getElementById('modalNovaEscuta').addEventListener('click', e => { if (e.target.id === 'modalNovaEscuta') fecharModalNovaEscuta(); });
document.getElementById('btnSalvarNovaEscuta').addEventListener('click', async () => {
  const notaVal = document.getElementById('neNota').value;
  try {
    await L.api('/api/musica/escutas', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        album_id: escutasAlbumId,
        data: document.getElementById('neData').value,
        nota: notaVal === '' ? null : parseFloat(notaVal),
        faixa_favorita: document.getElementById('neFaixa').value,
        review: document.getElementById('neReview').value,
      }),
    });
    L.toast('Escuta registrada.');
    fecharModalNovaEscuta();
    carregarCarrossel();
    carregar();
  } catch (e) {
    L.toast(e.message, true);
  }
});

L.initReveal();
L.initClock();
L.initModuleSwitcher('musica');
L.initGlow();
document.getElementById('genTime').textContent = 'carregado ' + new Date().toLocaleTimeString('pt-BR');
carregar();
})();
</script>
</body>
</html>
